<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · 页面走失了</title>
    <meta name="description" content="这一页像水一样流走了。回到水神崛起的个人主页继续逛逛。">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#e8f1f8">
    <meta name="color-scheme" content="light">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 与首页共用同一份字体 URL，浏览器缓存可以复用；preload 切换避免阻塞首屏 -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=DM+Sans:wght@300;400;500;700&family=Playfair+Display:wght@400;600&display=swap"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=DM+Sans:wght@300;400;500;700&family=Playfair+Display:wght@400;600&display=swap">
    </noscript>
    <!-- 404 只需几 KB 样式，不再为它同步加载整站 90 KB 的 style.css -->
    <style>
        :root {
            --font-display: 'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', serif;
            --font-body: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            --font-en: 'DM Sans', system-ui, sans-serif;
            --color-text: #1a2a3a;
            --color-text-muted: rgba(26, 42, 58, 0.72);
            --color-accent: #009e8e;
            --color-accent-deep: #007a6d;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: var(--font-body);
            color: var(--color-text);
            overflow-x: hidden;
            background: linear-gradient(180deg, #e8f1f8 0%, #dce8f2 45%, #e8f1f8 100%);
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse 110% 70% at 50% 0%, rgba(0, 180, 210, 0.14), transparent 60%);
        }
        :focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 3px;
            border-radius: 8px;
        }
        .skip-link {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            padding: 10px 18px;
            border-radius: 999px;
            background: var(--color-accent-deep);
            color: #fff;
            font-size: .85rem;
            text-decoration: none;
            transform: translateY(-200%);
        }
        .skip-link:focus { transform: translateY(0); }

        /* 加载屏：只在这一个页面用，样式自带，不依赖全站 CSS */
        .loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 26px;
            background: #e8f1f8;
            transition: opacity .5s ease, visibility 0s .5s;
        }
        .loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loading-water { position: relative; width: 64px; height: 64px; }
        .loading-ripple {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(0, 158, 142, .45);
            border-radius: 50%;
            animation: ripple 1.8s ease-out infinite;
        }
        .loading-ripple:nth-child(2) { animation-delay: .6s; }
        .loading-ripple:nth-child(3) { animation-delay: 1.2s; }
        .loading-text {
            font-family: var(--font-display);
            font-size: 1.1rem;
            letter-spacing: .12em;
            color: var(--color-text-muted);
            animation: loadPulse 1.8s ease-in-out infinite;
        }
        @keyframes ripple {
            0% { transform: scale(.25); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        @keyframes loadPulse { 0%, 100% { opacity: .68; } 50% { opacity: 1; } }

        .music-player { position: fixed; top: 14px; right: 18px; z-index: 20; }
        .notfound-home { position: fixed; top: 18px; left: 18px; z-index: 20; }
        .container {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 60px;
        }
        .hero { width: 100%; display: flex; flex-direction: column; align-items: center; }
        .notfound-code {
            position: relative;
            display: inline-block;
            font-family: var(--font-display);
            font-size: clamp(5rem, 20vw, 13rem);
            line-height: 1;
            font-weight: 900;
            color: var(--color-text);
            text-shadow: 0 0 80px rgba(0, 158, 142, .4), 0 0 160px rgba(0, 158, 142, .15);
        }
        .notfound-code::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 130%;
            height: 230%;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse at center, rgba(0, 158, 142, .12), transparent 65%);
            pointer-events: none;
            z-index: -1;
            animation: heroGlow 8s ease-in-out infinite alternate;
        }
        @keyframes heroGlow { from { opacity: .55; } to { opacity: 1; } }
        .notfound-sub {
            font-family: var(--font-en);
            font-size: clamp(.85rem, 1.8vw, 1.05rem);
            font-weight: 400;
            letter-spacing: .3em;
            color: var(--color-text-muted);
            margin-top: 28px;
        }
        .notfound-tip {
            font-size: clamp(.95rem, 2.4vw, 1.2rem);
            color: var(--color-text-muted);
            margin-top: 18px;
            line-height: 1.8;
        }
        .notfound-btn {
            margin-top: 36px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #009e8e, #00b8a0);
            box-shadow: 0 10px 30px rgba(0, 158, 142, .35);
            text-decoration: none;
            transition: transform .25s ease, box-shadow .25s ease;
        }
        .notfound-btn:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(0, 158, 142, .45); }
        .notfound-home .notfound-btn { margin-top: 0; padding: 10px 22px; font-size: .9rem; }

        @media (max-width: 768px) { .music-player { display: none; } }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .loading-ripple, .loading-text, .notfound-code::before { animation: none; }
            .notfound-btn { transition: none; }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">跳到正文</a>

    <!-- 加载屏 -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-water" aria-hidden="true">
            <div class="loading-ripple"></div>
            <div class="loading-ripple"></div>
            <div class="loading-ripple"></div>
        </div>
        <p class="loading-text">寻找页面中…</p>
    </div>

    <!-- 顶部音乐播放器 -->
    <div class="music-player">
        <iframe frameborder="no" border="0" marginwidth="0" marginheight="0" width="330" height="86"
                loading="lazy" title="网易云音乐播放器"
                src="https://music.163.com/outchain/player?type=2&amp;id=65546&amp;auto=0&amp;height=66"></iframe>
    </div>

    <div class="notfound-home">
        <a href="index.html" class="notfound-btn">返回主页</a>
    </div>

    <main class="container" id="main-content">
        <section class="hero">
            <h1 class="notfound-code">404</h1>
            <p class="notfound-sub">PAGE NOT FOUND</p>
            <p class="notfound-tip">
                这一页，像水一样流走了。<br>
                也许是链接拼写有误，也许是它从未存在过。
            </p>
            <a href="index.html" class="notfound-btn">回到主页</a>
        </section>
    </main>

    <script>
        // 加载屏淡出：不等 window.load —— 第三方 iframe 慢起来会把整页一起拖住
        (function () {
            const screen = document.getElementById('loadingScreen');
            if (!screen) return;
            const hide = () => setTimeout(() => screen.classList.add('hidden'), 150);
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', hide, { once: true });
            } else {
                hide();
            }
            // 兜底：DOMContentLoaded 被第三方资源卡住时也不能一直遮着
            setTimeout(hide, 2500);
        })();
    </script>
</body>
</html>
