<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客编辑器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Serif SC', 'PingFang SC', 'system-ui', 'sans-serif'],
                        display: ['ZCOOL KuaiLe', 'cursive'],
                    },
                    colors: {
                        accent: '#f97316',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="doc/article.css">
    <style>
.toolbar {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
        }
        .toolbar-btn {
            transition: all 0.2s var(--ease);
        }
        .toolbar-btn:hover {
            background: rgba(249, 115, 22, 0.1);
            color: var(--accent);
        }
        .toolbar-btn.active {
            background: var(--accent);
            color: white;
        }
        .editor-area {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            min-height: 500px;
        }
        .editor-content {
            line-height: 1.85;
            color: var(--text-secondary);
            outline: none;
            min-height: 450px;
        }
        .editor-content:empty::before {
            content: '在此输入文章内容...';
            color: var(--text-muted, #94a3b8);
            pointer-events: none;
        }
        .editor-content p { margin-bottom: 1rem; text-indent: 2em; }
        /* 正文首字下沉 */
        .editor-content p:first-of-type::first-letter {
            font-size: 2.5em;
            font-weight: 700;
            color: var(--accent);
            float: left;
            line-height: 1;
            margin-right: 0.1em;
            margin-top: 0.1em;
        }
        /* 首段取消缩进，让首字下沉更自然 */
        .editor-content p:first-of-type { text-indent: 0; }
        .editor-content h1 { font-size: 1.8rem; font-weight: 700; margin: 1.5rem 0; color: var(--text-primary); }
        .editor-content h2 { font-size: 1.5rem; font-weight: 700; margin: 1.5rem 0; padding-left: 16px; border-left: 4px solid var(--accent); }
        .editor-content h3 { font-size: 1.2rem; font-weight: 600; margin: 1.2rem 0; color: var(--text-primary); }
        .editor-content ul, .editor-content ol { padding-left: 2rem; margin: 1rem 0; }
        .editor-content li { margin-bottom: 0.5rem; }
        .editor-content ul li::marker { color: var(--accent); }
        .editor-content ol li::marker { color: var(--accent); font-weight: 600; }
        .editor-content blockquote {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.08), rgba(249, 115, 22, 0.03));
            border-left: 4px solid var(--accent);
            padding: 1rem 1.5rem;
            margin: 1rem 0;
            font-style: italic;
        }
        /* 引用块首字下沉 */
        .editor-content blockquote::first-letter {
            font-size: 2.5em;
            font-weight: 700;
            color: var(--accent);
            float: left;
            line-height: 1;
            margin-right: 0.1em;
            margin-top: 0.1em;
        }
        .editor-content pre {
            background: linear-gradient(135deg, #1e1e2e, #1a1a2e);
            color: #cdd6f4;
            padding: 2rem 1rem 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1rem 0;
            font-family: 'Fira Code', monospace;
            position: relative;
        }
        /* 代码块语言标签 */
        .editor-content .pre-wrapper {
            position: relative;
            margin: 1rem 0;
        }
        .editor-content .pre-wrapper .code-lang-label {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
            padding: 2px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            cursor: text;
            outline: none;
            min-width: 40px;
            text-align: center;
            transition: all 0.2s ease;
            z-index: 1;
        }
        .editor-content .pre-wrapper .code-lang-label:focus {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(249,115,22,0.08);
        }
        .editor-content .pre-wrapper .code-lang-label:empty::before {
            content: 'language';
            color: rgba(255,255,255,0.3);
        }
        .editor-content code {
            background: rgba(249, 115, 22, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
            color: var(--accent);
            font-family: 'Fira Code', monospace;
        }
        .editor-content em { font-style: italic; }
        .editor-content strong { font-weight: 700; color: var(--text-primary); }
        .editor-content u { text-decoration: underline; }
        .editor-content s { text-decoration: line-through; }
        .btn-generate {
            background: linear-gradient(135deg, var(--accent), #fb923c);
            transition: all 0.3s var(--ease);
        }
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.4);
        }
        .save-indicator {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 32px;
            width: 90%;
            max-width: 900px;
            max-height: 85vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s var(--ease);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .code-output {
            background: #1e1e2e;
            color: #cdd6f4;
            border-radius: 8px;
            padding: 1rem;
            overflow: auto;
            flex: 1;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .dark .prose blockquote { background: rgba(249, 115, 22, 0.05); }
        .dark .prose code { background: rgba(249, 115, 22, 0.15); }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            border: none;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .modal-close:hover { background: rgba(0, 0, 0, 0.2); transform: rotate(90deg); }
        .save-badge {
            background: linear-gradient(135deg, #10b981, #059669);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .code-block-tip {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateY(8px);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 10px 24px;
            border-radius: 999px;
            font-size: 14px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            z-index: 9999;
        }
        .code-block-tip.show {
            opacity: 1;
            transform: translate(-50%, -50%) translateY(0);
        }

        /* ═══════════════════════════════════════════
           Claymorphism · 粘土态编辑器风格
           ═══════════════════════════════════════════ */
/* ── 导航栏 — 陶土凸起 ── */
        .fixed.top-0.left-0.right-0.h-16 {
            background: #e0e5ec !important;
            border-bottom: none !important;
            box-shadow:
                6px 6px 16px rgba(163, 177, 198, 0.45),
                -4px -4px 12px rgba(255, 255, 255, 0.7);
        }

        .dark .fixed.top-0.left-0.right-0.h-16 {
            background: #1a2030 !important;
            box-shadow:
                6px 6px 16px rgba(0, 0, 0, 0.35),
                -4px -4px 12px rgba(50, 60, 80, 0.2);
        }

        /* 返回按钮 — 陶土凸起 */
/* 主题切换 — 陶土圆形 */
/* ── 工具栏 — 陶土凹陷容器 ── */
        .toolbar {
            background: #e0e5ec !important;
            border: none !important;
            box-shadow:
                inset 5px 5px 14px rgba(163, 177, 198, 0.42),
                inset -5px -5px 14px rgba(255, 255, 255, 0.65),
                6px 6px 16px rgba(163, 177, 198, 0.25),
                -4px -4px 12px rgba(255, 255, 255, 0.35);
        }

        .dark .toolbar {
            background: #1a2030 !important;
            box-shadow:
                inset 5px 5px 14px rgba(0, 0, 0, 0.25),
                inset -5px -5px 14px rgba(40, 52, 76, 0.18);
        }

        /* 工具栏按钮 — 陶土圆钮 */
        .toolbar-btn {
            background: transparent !important;
            border-radius: 12px !important;
            color: #5a6a7a !important;
            box-shadow: none !important;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }

        .dark .toolbar-btn { color: #94a3b8 !important; }

        .toolbar-btn:hover {
            background: rgba(249, 115, 22, 0.08) !important;
            transform: scale(1.1);
        }

        .toolbar-btn.active {
            background: linear-gradient(145deg, var(--accent), #ea580c) !important;
            color: white !important;
            box-shadow:
                3px 3px 8px rgba(249, 115, 22, 0.35),
                -2px -2px 6px rgba(255, 200, 150, 0.3) !important;
        }

        /* ── 标题输入框 — 陶土凹陷 ── */
        #articleTitle {
            background: #e0e5ec !important;
            padding-left: 20px !important;
            padding-right: 20px !important;
            border-radius: 18px !important;
            border-bottom-color: transparent !important;
            box-shadow:
                inset 4px 4px 10px rgba(163, 177, 198, 0.42),
                inset -4px -4px 10px rgba(255, 255, 255, 0.65) !important;
            transition: all 0.35s ease !important;
        }

        .dark #articleTitle {
            background: #1a2030 !important;
            box-shadow:
                inset 4px 4px 10px rgba(0, 0, 0, 0.28),
                inset -4px -4px 10px rgba(40, 52, 76, 0.22) !important;
        }

        #articleTitle:focus {
            box-shadow:
                inset 4px 4px 10px rgba(163, 177, 198, 0.38),
                inset -4px -4px 10px rgba(255, 255, 255, 0.7),
                0 0 0 3px rgba(249, 115, 22, 0.15) !important;
        }

        /* ── 编辑器区域 — 陶土凸起卡片 ── */
        .editor-area {
            background: #e0e5ec !important;
            border: none !important;
            box-shadow:
                10px 10px 26px rgba(163, 177, 198, 0.48),
                -10px -10px 26px rgba(255, 255, 255, 0.72),
                inset 0 0 0 rgba(163, 177, 198, 0);
            transition: all 0.4s ease;
        }

        .dark .editor-area {
            background: #1a2030 !important;
            box-shadow:
                10px 10px 26px rgba(0, 0, 0, 0.32),
                -10px -10px 26px rgba(40, 52, 76, 0.18);
        }

        /* 编辑器内容文字颜色适配 */
        .editor-content { color: var(--text-secondary); }
        .dark .editor-content { color: #cbd5e1; }

        /* 编辑器内引用块 — 陶土凹陷 */
        .editor-content blockquote {
            background: transparent !important;
            border-left: none !important;
            padding: 1rem 1.5rem !important;
            margin: 1rem 0;
            border-radius: 14px !important;
            box-shadow:
                inset 4px 4px 12px rgba(163, 177, 198, 0.38),
                inset -4px -4px 12px rgba(255, 255, 255, 0.62);
        }

        .dark .editor-content blockquote {
            box-shadow:
                inset 4px 4px 12px rgba(0, 0, 0, 0.25),
                inset -4px -4px 12px rgba(40, 52, 76, 0.2);
        }

        /* 编辑器内代码块 — 陶土凹陷 */
        .editor-content pre {
            background: #d8dde6 !important;
            border-radius: 14px !important;
            box-shadow:
                inset 4px 4px 12px rgba(163, 177, 198, 0.42),
                inset -4px -4px 12px rgba(255, 255, 255, 0.65);
        }

        .dark .editor-content pre {
            background: #141c2c !important;
            box-shadow:
                inset 4px 4px 12px rgba(0, 0, 0, 0.28),
                inset -4px -4px 12px rgba(30, 40, 58, 0.22);
        }

        /* 行内代码 — 陶土微凹 */
        .editor-content code {
            background: #e0e5ec !important;
            color: #c75000 !important;
            border-radius: 7px !important;
            box-shadow:
                inset 2px 2px 5px rgba(163, 177, 198, 0.32),
                inset -2px -2px 5px rgba(255, 255, 255, 0.55);
        }

        .dark .editor-content code {
            background: #242e42 !important;
            color: #fb923c !important;
            box-shadow:
                inset 2px 2px 5px rgba(0, 0, 0, 0.2),
                inset -2px -2px 5px rgba(40, 52, 76, 0.15);
        }

        /* 代码语言标签 */
        .code-lang-label {
            background: #d8dde6 !important;
            border: none !important;
            box-shadow:
                inset 2px 2px 6px rgba(163, 177, 198, 0.35),
                inset -2px -2px 6px rgba(255, 255, 255, 0.5);
        }

        /* ── 操作按钮 — 陶土风格 ── */

        /* 草稿按钮 — 凸起 */
        main button:not(.btn-generate):not(.modal-close):not([onclick^="copy"]) {
            background: #e0e5ec !important;
            color: #5a6a7a !important;
            border-radius: 16px !important;
            box-shadow:
                5px 5px 14px rgba(163, 177, 198, 0.48),
                -4px -4px 12px rgba(255, 255, 255, 0.65);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }

        .dark main button:not(.btn-generate):not(.modal-close):not([onclick^="copy"]) {
            background: #242e42 !important;
            color: #94a3b8 !important;
            box-shadow:
                5px 5px 14px rgba(0, 0, 0, 0.28),
                -4px -4px 12px rgba(50, 62, 85, 0.2);
        }

        main button:not(.btn-generate):not(.modal-close):not([onclick^="copy"]):hover {
            transform: translateY(-2px);
            box-shadow:
                7px 7px 18px rgba(163, 177, 198, 0.42),
                -5px -5px 16px rgba(255, 255, 255, 0.58);
        }

        /* 生成按钮 — 强调色凸起 */
        .btn-generate {
            background: linear-gradient(145deg, #f97316, #ea580c) !important;
            box-shadow:
                6px 6px 18px rgba(249, 115, 22, 0.38),
                -3px -3px 12px rgba(255, 255, 255, 0.45) !important;
            border-radius: 18px !important;
        }

        .btn-generate:hover {
            transform: translateY(-4px) scale(1.03) !important;
            box-shadow:
                10px 10px 26px rgba(249, 115, 22, 0.42),
                -4px -4px 16px rgba(255, 255, 255, 0.5) !important;
        }

        /* ── 弹窗 — 陶土风格 ── */
        .modal-content {
            background: #e0e5ec !important;
            border-radius: 28px !important;
            box-shadow:
                14px 14px 36px rgba(163, 177, 198, 0.5),
                -14px -14px 36px rgba(255, 255, 255, 0.72);
        }

        .dark .modal-content {
            background: #1a2030 !important;
            box-shadow:
                14px 14px 36px rgba(0, 0, 0, 0.35),
                -14px -14px 36px rgba(40, 52, 76, 0.18);
        }

        /* 弹窗关闭按钮 — 陶土圆形 */
        .modal-close {
            background: #e0e5ec !important;
            border-radius: 50% !important;
            box-shadow:
                4px 4px 10px rgba(163, 177, 198, 0.5),
                -3px -3px 8px rgba(255, 255, 255, 0.65);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }

        .dark .modal-close {
            background: #242e42 !important;
            box-shadow:
                4px 4px 10px rgba(0, 0, 0, 0.3),
                -3px -3px 8px rgba(50, 62, 85, 0.25);
        }

        .modal-close:hover {
            transform: rotate(90deg);
            box-shadow:
                inset 3px 3px 8px rgba(163, 177, 198, 0.42),
                inset -3px -3px 8px rgba(255, 255, 255, 0.62) !important;
        }

        /* 代码输出区 — 陶土凹陷 */
        .code-output {
            background: #d8dde6 !important;
            border-radius: 16px !important;
            font-size: 1rem !important;
            color: #334155 !important;
            line-height: 1.75 !important;
            box-shadow:
                inset 5px 5px 14px rgba(163, 177, 198, 0.42),
                inset -5px -5px 14px rgba(255, 255, 255, 0.65);
        }

        /* codeOutput 滚动条 — 陶土风格 */
        .code-output::-webkit-scrollbar {
            width: 16px;
            height: 16px;
        }

        .code-output::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 12px;
        }

        .code-output::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #c8cdd8, #b8bdd0);
            border-radius: 12px;
            border: 3px solid transparent;
            background-clip: content-box;
            transition: all 0.3s ease;
        }

        .code-output::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #a8adbf, #989dc0);
            background-clip: content-box;
        }

        .dark .code-output::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #2a354a, #384260);
            background-clip: content-box;
        }

        .dark .code-output::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #3a4560, #485270);
            background-clip: content-box;
        }

        .dark .code-output {
            background: #141c2c !important;
            color: #e2e8f0 !important;
            box-shadow:
                inset 5px 5px 14px rgba(0, 0, 0, 0.28),
                inset -5px -5px 14px rgba(30, 40, 58, 0.22);
        }

        /* 弹窗按钮 — 陶土 */
        .modal-content button[onclick^="copy"] {
            background: #e0e5ec !important;
            color: #5a6a7a !important;
            border-radius: 14px !important;
            box-shadow:
                4px 4px 10px rgba(163, 177, 198, 0.45),
                -3px -3px 8px rgba(255, 255, 255, 0.6);
            transition: all 0.35s ease !important;
        }

        .dark .modal-content button[onclick^="copy"] {
            background: #242e42 !important;
            color: #94a3b8 !important;
        }

        .modal-content button[onclick^="copy"]:hover {
            transform: scale(1.05);
        }

        /* 下载按钮 — 渐变凸起 */
        .modal-content button[onclick^="download"] {
            background: linear-gradient(145deg, #10b981, #059669) !important;
            border-radius: 14px !important;
            box-shadow:
                4px 4px 12px rgba(16, 185, 129, 0.35),
                -2px -2px 8px rgba(255, 255, 255, 0.4) !important;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }

        .modal-content button[onclick^="download"]:hover {
            transform: translateY(-2px);
        }

        /* 分隔线 */
        .w-px.h-8.bg-gray-300 {
            background: rgba(163, 177, 198, 0.4) !important;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .dark .w-px.h-8.bg-gray-600 {
            background: rgba(50, 60, 80, 0.5) !important;
        }
    </style>
</head>
<body class="min-h-screen">
    <header class="fixed top-0 left-0 right-0 h-16 bg-white/80 dark:bg-gray-900/80 backdrop-blur-xl border-b border-gray-200 dark:border-gray-700 z-40">
        <div class="h-full flex items-center justify-between px-6">
            <div class="flex items-center gap-4">
                <a href="doc/index.html" class="inline-flex items-center gap-2 px-4 py-2 text-sm text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-800 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-all" target="_blank" rel="noopener noreferrer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-9V3a1 1 0 00-1-1h-3a1 1 0 00-1 1v9"/>
                    </svg>
                    <span>返回主页</span>
                </a>
                <span class="text-xl font-bold bg-gradient-to-r from-orange-500 to-orange-600 bg-clip-text text-transparent">博客编辑器</span>
            </div>
            <div class="flex items-center gap-3">
                <span id="saveStatus" class="hidden text-sm text-green-600 dark:text-green-400 font-medium"></span>
                <button id="themeToggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-all">
                    <svg id="sunIcon" class="w-5 h-5 text-gray-600 dark:text-gray-400 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>

                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>

                <div class="w-px h-8 bg-gray-300 dark:bg-gray-600 mx-1 self-center"></div>
                
                <button class="toolbar-btn p-2.5 rounded-lg" onclick="insertParagraph()" title="段落">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h12"/></svg>

                <button class="toolbar-btn p-2.5 rounded-lg" onclick="clearContent()" title="清空内容">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>

                <button onclick="saveToLocalStorage()" class="px-6 py-3 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-xl font-medium hover:bg-gray-300 dark:hover:bg-gray-600 transition-all flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                    保存草稿

                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    加载草稿
                </button>
                <button onclick="generateHTML()" class="btn-generate px-8 py-3 text-white rounded-xl font-medium flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>

    <div id="codeModal" class="modal-overlay">
        <div class="modal-content relative">
            <button class="modal-close" onclick="closeModal()">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <h2 class="text-xl font-bold mb-4 text-gray-900 dark:text-white">生成的 HTML 代码</h2>
            <pre id="codeOutput" class="code-output"></pre>
            <div class="mt-4 flex justify-end gap-3">
                <button onclick="copyGeneratedCode()" class="px-6 py-2.5 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg font-medium hover:bg-gray-300 dark:hover:bg-gray-600 transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    复制代码
                </button>
                <button onclick="downloadHTML()" class="px-6 py-2.5 bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-lg font-medium hover:shadow-lg transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    下载文件
                </button>
            </div>
        </div>
    </div>

    <script>
        /* ====== 暗色模式切换 ====== */
        const themeToggle = document.getElementById('themeToggle');
        const root = document.documentElement;

        // 让编辑器用 <p> 而非 <div> 包裹段落，确保首字下沉生效
        try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}

        if (localStorage.getItem('theme') === 'dark' ||
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            root.classList.add('dark');
        }

        themeToggle.addEventListener('click', () => {
            root.classList.toggle('dark');
            localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
        });

        /* ====== 富文本格式化 ====== */
        function formatText(command) {
            document.execCommand(command, false, null);
            document.getElementById('editor').focus();
        }

        function formatBlock(tag) {
            const editor = document.getElementById('editor');
            // 切换引用块 / 代码块：已在块中则取消
            if (tag === 'blockquote' || tag === 'pre') {
                const sel = window.getSelection();
                if (sel.rangeCount) {
                    const el = sel.anchorNode.nodeType === 3
                        ? sel.anchorNode.parentNode : sel.anchorNode;
                    const container = el.closest && el.closest(tag);
                    if (container) {
                        const fragment = document.createDocumentFragment();
                        while (container.firstChild) fragment.appendChild(container.firstChild);
                        container.replaceWith(fragment);
                        editor.focus();
                        return;
                    }
                }
            }
            if (tag === 'pre') {
                // 创建带语言标签的代码块结构
                const sel = window.getSelection();
                if (sel.rangeCount) {
                    const range = sel.getRangeAt(0);
                    // 保存选中内容（如果有）
                    const selectedContent = range.extractContents();
                    // 创建代码块包装器
                    const wrapper = document.createElement('div');
                    wrapper.className = 'pre-wrapper';
                    // 语言标签（可编辑）
                    const langLabel = document.createElement('span');
                    langLabel.className = 'code-lang-label';
                    langLabel.contentEditable = 'true';
                    langLabel.textContent = 'javascript';
                    langLabel.spellcheck = false;
                    // 代码块
                    const pre = document.createElement('pre');
                    pre.contentEditable = 'true';
                    pre.appendChild(selectedContent);
                    if (!pre.textContent.trim()) {
                        pre.textContent = '// 在此输入代码...';
                    }
                    wrapper.appendChild(langLabel);
                    wrapper.appendChild(pre);
                    range.insertNode(wrapper);
                    // 光标移到 pre 内
                    editor.focus();
                    const newRange = document.createRange();
                    newRange.selectNodeContents(pre);
                    newRange.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(newRange);
                    showCodeBlockTip();
                }
            } else {
                document.execCommand('formatBlock', false, tag);
                editor.focus();
            }
        }

        let codeBlockTipTimer = null;
        function showCodeBlockTip() {
            let tip = document.getElementById('codeBlockTip');
            if (!tip) {
                tip = document.createElement('div');
                tip.id = 'codeBlockTip';
                tip.className = 'code-block-tip';
                tip.textContent = '连按两次回车可退出代码块';
                document.body.appendChild(tip);
            }
            clearTimeout(codeBlockTipTimer);
            tip.classList.add('show');
            codeBlockTipTimer = setTimeout(() => tip.classList.remove('show'), 1800);
        }

        function insertParagraph() {
            document.execCommand('insertParagraph', false, null);
            document.getElementById('editor').focus();
        }

        function clearContent() {
            if (confirm('确定要清空所有内容吗？')) {
                document.getElementById('articleTitle').value = '';
                document.getElementById('editor').innerHTML = '';
            }
        }

        /* ====== 键盘快捷键 ====== */
        let lastEnterInCodeBlock = false;

        document.getElementById('editor').addEventListener('keydown', (e) => {
            // 归一化：如果编辑器只有裸文本节点（未被 p/h1/h2 等包裹），先包裹再让 Enter 正常处理
            if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
                const editor = document.getElementById('editor');
                const blockTags = ['P', 'H1', 'H2', 'H3', 'UL', 'OL', 'BLOCKQUOTE', 'PRE', 'DIV'];
                const hasBlockWrapper = Array.from(editor.children).some(c => blockTags.includes(c.tagName));
                // 没有任何块级子元素但有文本内容 → 用 <p> 包裹
                if (!hasBlockWrapper && editor.textContent.trim()) {
                    e.preventDefault();
                    editor.innerHTML = '<p>' + editor.innerHTML + '</p>';
                    const p = editor.querySelector('p');
                    const range = document.createRange();
                    range.selectNodeContents(p);
                    range.collapse(false);
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                    // 归一化后手动触发换行
                    document.execCommand('insertParagraph', false, null);
                    return;
                }
            }
            // Enter：引用块末尾自动跳出；代码块末尾连按两次回车跳出
            if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
                const sel = window.getSelection();
                if (sel.rangeCount) {
                    const node = sel.anchorNode;
                    const el = node.nodeType === 3 ? node.parentNode : node;
                    // 引用块
                    const bq = el.closest && el.closest('blockquote');
                    if (bq) {
                        const range = sel.getRangeAt(0);
                        const after = range.cloneRange();
                        after.selectNodeContents(bq);
                        after.setStart(range.endContainer, range.endOffset);
                        if (!after.toString().trim()) {
                            e.preventDefault();
                            const newP = document.createElement('p');
                            newP.innerHTML = '<br>';
                            if (bq.nextSibling) {
                                bq.parentNode.insertBefore(newP, bq.nextSibling);
                            } else {
                                bq.parentNode.appendChild(newP);
                            }
                            sel.removeAllRanges();
                            sel.addRange(document.createRange());
                            sel.getRangeAt(0).setStart(newP, 0);
                            sel.getRangeAt(0).collapse(true);
                            return;
                        }
                    }
                    // 代码块：连按两次回车在末尾跳出
                    const preNode = el.closest && el.closest('pre');
                    if (preNode) {
                        const range = sel.getRangeAt(0);
                        const textNode = range.startContainer;
                        let isAtEnd = false;

                        if (textNode.nodeType === Node.TEXT_NODE) {
                            const textAfterCursor = textNode.textContent.substring(range.startOffset);
                            if (textAfterCursor.trim() === '') {
                                let nextSibling = textNode.nextSibling;
                                let hasMoreContent = false;
                                while (nextSibling) {
                                    if (nextSibling.textContent && nextSibling.textContent.trim() !== '') {
                                        hasMoreContent = true;
                                        break;
                                    }
                                    nextSibling = nextSibling.nextSibling;
                                }
                                if (!hasMoreContent) {
                                    isAtEnd = true;
                                }
                            }
                        } else {
                            const after = range.cloneRange();
                            after.selectNodeContents(preNode);
                            after.setStart(range.endContainer, range.endOffset);
                            if (!after.toString().trim()) {
                                isAtEnd = true;
                            }
                        }

                        if (isAtEnd) {
                            if (lastEnterInCodeBlock) {
                                e.preventDefault();
                                lastEnterInCodeBlock = false;

                                const lines = preNode.textContent.split('\n');
                                if (lines[lines.length - 1].trim() === '') {
                                    lines.pop();
                                    preNode.textContent = lines.join('\n');
                                }

                                // 删除整个 pre-wrapper
                                const preWrapper = preNode.parentElement;
                                const newParagraph = document.createElement('p');
                                newParagraph.innerHTML = '<br>';
                                if (preWrapper.nextSibling) {
                                    editor.insertBefore(newParagraph, preWrapper.nextSibling);
                                } else {
                                    editor.appendChild(newParagraph);
                                }

                                const newRange = document.createRange();
                                newRange.setStart(newParagraph, 0);
                                newRange.collapse(true);
                                sel.removeAllRanges();
                                sel.addRange(newRange);
                            } else {
                                lastEnterInCodeBlock = true;
                            }
                        } else {
                            lastEnterInCodeBlock = false;
                        }
                    } else {
                        lastEnterInCodeBlock = false;
                    }
                }
            } else {
                lastEnterInCodeBlock = false;
            }
            // Backspace/Delete：代码块内容清空后直接删除代码块
            if ((e.key === 'Backspace' || e.key === 'Delete') && !e.ctrlKey && !e.metaKey) {
                const sel = window.getSelection();
                if (sel.rangeCount) {
                    const node = sel.anchorNode;
                    const el = node.nodeType === 3 ? node.parentNode : node;
                    const preWrapper = el.closest && el.closest('.pre-wrapper');
                    if (preWrapper) {
                        setTimeout(() => {
                            const preInWrapper = preWrapper.querySelector('pre');
                            if (preInWrapper && !preInWrapper.textContent.trim()) {
                                preWrapper.remove();
                                if (!editor.querySelector('p')) {
                                    const p = document.createElement('p');
                                    p.innerHTML = '<br>';
                                    editor.appendChild(p);
                                }
                                editor.focus();
                            }
                        }, 10);
                    }
                }
            }
            if (e.ctrlKey || e.metaKey) {
                switch(e.key.toLowerCase()) {
                    case 'b': e.preventDefault(); formatText('bold'); break;
                    case 'i': e.preventDefault(); formatText('italic'); break;
                    case 'u': e.preventDefault(); formatText('underline'); break;
                    case 's': e.preventDefault(); saveToLocalStorage(); break;
                }
            }
        });

        // 点击代码块下方空白区域时，自动创建段落以允许输入
        document.getElementById('editor').addEventListener('mouseup', (e) => {
            const editor = document.getElementById('editor');
            if (e.target === editor) {
                const last = editor.lastElementChild;
                if (last && last.classList.contains('pre-wrapper') && e.offsetY > last.offsetTop + last.offsetHeight) {
                    const p = document.createElement('p');
                    p.innerHTML = '<br>';
                    editor.appendChild(p);
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    const range = document.createRange();
                    range.setStart(p, 0);
                    range.collapse(true);
                    sel.addRange(range);
                }
            }
        });

        /* ====== 本地存储 ====== */
        function saveToLocalStorage() {
            const title = document.getElementById('articleTitle').value;
            const content = document.getElementById('editor').innerHTML;
            
            localStorage.setItem('blogEditor_title', title);
            localStorage.setItem('blogEditor_content', content);
            localStorage.setItem('blogEditor_savedAt', new Date().toLocaleString('zh-CN'));
            
            const status = document.getElementById('saveStatus');
            status.textContent = '已保存';
            status.classList.remove('hidden');
            status.classList.add('save-badge', 'px-3', 'py-1', 'rounded-full', 'text-white', 'text-xs');
            
            setTimeout(() => status.classList.add('hidden'), 2000);
        }

        function loadFromLocalStorage() {
            const title = localStorage.getItem('blogEditor_title');
            const content = localStorage.getItem('blogEditor_content');
            const savedAt = localStorage.getItem('blogEditor_savedAt');
            
            if (title || content) {
                document.getElementById('articleTitle').value = title || '';
                document.getElementById('editor').innerHTML = content || '';
                
                const status = document.getElementById('saveStatus');
                status.textContent = `已加载 ${savedAt || ''} 的草稿`;
                status.classList.remove('hidden');
                status.classList.remove('save-badge');
                status.classList.add('text-gray-500', 'dark:text-gray-400');
                
                setTimeout(() => status.classList.add('hidden'), 3000);
            } else {
                alert('没有找到已保存的草稿');
            }
        }

        /* ====== 自动保存 ====== */
        let autoSaveTimer;
        document.getElementById('editor').addEventListener('input', () => {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(saveToLocalStorage, 3000);
        });
        document.getElementById('articleTitle').addEventListener('input', () => {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(saveToLocalStorage, 3000);
        });

        /* ====== 生成HTML ====== */
        function generateHTML() {
            const title = document.getElementById('articleTitle').value || '无题';
            // 处理代码块：提取语言标签并转为 data 属性
            let rawContent = document.getElementById('editor').innerHTML;
            rawContent = rawContent.replace(
                /<div class="pre-wrapper">\s*<span[^>]*class="code-lang-label"[^>]*>([\s\S]*?)<\/span>\s*(<pre[\s\S]*?<\/pre>)\s*<\/div>/gi,
                (match, lang, preTag) => {
                    return preTag.replace('<pre', `<pre data-lang="${lang.trim() || ''}"`);
                }
            );
            // 所有内容包裹在单个 .article-content 容器内，确保 ::first-letter 只作用于第一个字
            let content = rawContent.replace(/<p(\s[^>]*)?>/gi, '<div>').replace(/<\/p>/gi, '</div>');
            content = `<div class="article-content">${content}</div>`;
            
            if (!rawContent || /^<(p|div)><br><\/(p|div)>$/.test(rawContent.trim())) {
                alert('请先输入文章内容');
                return;
            }

            const html = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title}</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Serif SC', 'PingFang SC', 'system-ui', 'sans-serif'],
                        display: ['ZCOOL KuaiLe', 'cursive'],
                    },
                    colors: { accent: '#f97316' }
                }
            }
        }
    <\/script>
    <link rel="stylesheet" href="../article.css">

        function downloadHTML() {
            const code = document.getElementById('codeOutput').textContent;
            // 文件名为当前日期，格式模仿 doc/2026/ 下的文章（如 7.23.html）
            const now = new Date();
            const filename = `${now.getMonth() + 1}.${now.getDate()}.html`;

            const blob = new Blob([code], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById('codeModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('codeModal')) {
                closeModal();
            }
        });

        // ESC关闭弹窗

            if (e.key === 'Escape') closeModal();
