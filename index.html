<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="水神崛起的个人主页 - 前端开发者 | 游戏爱好者 | 动态视觉魔法师">
    <meta name="author" content="水神崛起">
    <title>水神崛起</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script async src="https://cdn.jsdelivr.net/npm/live2d-widget@3.0.4/lib/L2Dwidget.min.js"></script>
</head>
<body>
    <!-- 加载画面 -->
    <div class="loading-screen" aria-hidden="true">
        <div class="loading-text">海内存知己，天涯若比邻</div>
    </div>

    <div class="container">
        <header>
            <div class="music-player">
                <iframe
                    frameborder="0"
                    marginwidth="0"
                    marginheight="0"
                    width="100%"
                    height="86"
                    src="https://music.163.com/outchain/player?type=2&id=65546&auto=0&height=66"
                    title="网易云音乐播放器"
                    loading="lazy"
                ></iframe>
            </div>
        </header>

        <main>
            <div class="hero">
                <h1 class="hero-title animate-in" data-delay="0.2">
                    <span class="typewriter-text"></span>
                </h1>
                <p class="hero-subtitle animate-in" data-delay="0.5">
                    前端开发者 · 游戏爱好者 · 动态视觉魔法师
                </p>
                <p class="hero-hearts animate-in" data-delay="0.8">
                    <span class="heart-char">❤</span>
                    <span class="heart-char">❤</span>
                    <span class="heart-char">❤</span>
                </p>
            </div>

            <section class="contact animate-in" data-delay="1.1">
                <h3 class="contact-heading">联系我</h3>
                <div class="social-links">
                    <a href="https://github.com/TBssjq" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                        <img src="src/github.svg" alt="GitHub" width="32" height="32">
                    </a>
                    <a href="mailto:653294795@qq.com?subject=你好！&body=你好！" rel="nofollow" aria-label="Email">
                        <img src="src/email.svg" alt="Email" width="32" height="32">
                    </a>
                    <a href="https://space.bilibili.com/439038862" target="_blank" rel="noopener noreferrer" aria-label="Bilibili">
                        <img src="src/bilibili.svg" alt="Bilibili" width="32" height="32">
                    </a>
                </div>
            </section>
        </main>

        <footer></footer>
    </div>

    <!-- 右键菜单 -->
    <nav id="contextMenu" class="context-menu" role="menu" aria-label="快捷操作">
        <ul>
            <li role="menuitem" data-action="refresh">刷新主页</li>
            <li role="menuitem" data-action="bilibili">去我的 B 站</li>
            <li role="menuitem" data-action="email">给我发邮件</li>
            <li role="menuitem" data-action="top">返回顶部</li>
        </ul>
    </nav>

    <!-- 樱花画布 -->
    <canvas id="sakuraCanvas" aria-hidden="true"></canvas>

    <!-- 博客弹窗 -->
    <div id="blogModal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="博客导航">
        <div class="modal-card">
            <button class="modal-close" aria-label="关闭">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
            <div class="modal-body">
                <h2 class="modal-title">我的博客</h2>
                <p class="modal-desc">欢迎访问我的个人随笔空间</p>
            </div>
            <button class="modal-go" id="blogGoBtn">
                <span>Go!</span>
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        initLoadingScreen();
        initLive2D();
        initParticles();
        initDynamicTitle();
        initContextMenu();
        initSakura();
        initModal();
        initScrollReveal();
    });

    /* ── 加载画面 ── */
    function initLoadingScreen() {
        const screen = document.querySelector('.loading-screen');
        setTimeout(() => {
            screen.classList.add('hidden');
            setTimeout(() => {
                screen.remove();
                startTypewriter();
            }, 2000);
        }, 3000);
    }

    /* ── 打字机 ── */
    function startTypewriter() {
        const el = document.querySelector('.typewriter-text');
        const pairs = [
            { pin: 'NI',   ch: '你' },
            { pin: 'HAO',  ch: '好' },
            { pin: '!',    ch: '！' },
            { pin: 'WO',   ch: '我' },
            { pin: 'SHI',  ch: '是' },
            { pin: 'SHUI', ch: '水' },
            { pin: 'SHEN', ch: '神' },
            { pin: 'JUE',  ch: '崛' },
            { pin: 'QI',   ch: '起' }
        ];
        let pi = 0, ci = 0;

        (function tick() {
            if (pi >= pairs.length) return;
            const { pin, ch } = pairs[pi];
            if (ci < pin.length) {
                el.textContent += pin[ci++];
                setTimeout(tick, 100);
            } else {
                setTimeout(() => {
                    el.textContent = el.textContent.replace(pin, ch);
                    pi++; ci = 0;
                    setTimeout(tick, 500);
                }, 300);
            }
        })();
    }

    /* ── Live2D ── */
    function initLive2D() {
        function boot() {
            const w = window.innerWidth;
            const cfg = w < 768
                ? { width: 120, height: 180, scale: 0.3 }
                : w < 1024
                    ? { width: 150, height: 220, scale: 0.4 }
                    : { width: 180, height: 260, scale: 0.5 };

            L2Dwidget.init({
                model: { scale: cfg.scale },
                display: { position: 'right', width: cfg.width, height: cfg.height, hOffset: 0, vOffset: -20 },
                mobile: { show: true, scale: cfg.scale },
                react: { opacityDefault: 0.7, opacityOnHover: 0.2 }
            });
        }

        setTimeout(boot, 1000);
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                document.querySelector('#live2d-widget')?.remove();
                boot();
            }, 300);
        });
    }

    /* ── 点击粒子 ── */
    function initParticles() {
        const cvs = document.createElement('canvas');
        Object.assign(cvs.style, { position: 'fixed', inset: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 9999 });
        document.body.appendChild(cvs);
        const ctx = cvs.getContext('2d');
        const resize = () => { cvs.width = innerWidth; cvs.height = innerHeight; };
        resize();
        window.addEventListener('resize', resize);

        const colors = ['#5b9bd5', '#7ec8e3', '#a8d8ea', '#b8d4e3', '#6ea8d8', '#4a90c4', '#89b8e0'];
        const particles = [];

        function spawn(x, y) {
            for (let i = 0; i < 25; i++) {
                particles.push({
                    x, y,
                    r: Math.random() * 4 + 2,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    color: colors[Math.random() * colors.length | 0],
                    life: 1,
                    decay: Math.random() * 0.02 + 0.01
                });
            }
        }

        (function loop() {
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= p.decay; p.r *= 0.98;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(loop);
        })();

        document.addEventListener('click', e => spawn(e.clientX, e.clientY));
    }

    /* ── 动态标题 ── */
    function initDynamicTitle() {
        const title = document.title;
        document.addEventListener('visibilitychange', () => {
            document.title = document.hidden ? '(｡•́ω•̀｡) 你别走啊~' : '(✧∇✧) 你回来啦！';
            if (!document.hidden) setTimeout(() => { document.title = title; }, 1000);
        });
    }

    /* ── 右键菜单 ── */
    function initContextMenu() {
        const menu = document.getElementById('contextMenu');
        document.addEventListener('contextmenu', e => {
            e.preventDefault();
            menu.style.display = 'block';
            menu.style.left = `${e.clientX}px`;
            menu.style.top = `${e.clientY}px`;
        });
        document.addEventListener('click', () => { menu.style.display = 'none'; });
        menu.addEventListener('click', e => {
            const a = e.target.dataset.action;
            if (!a) return;
            ({ refresh: () => location.reload(), bilibili: () => open('https://space.bilibili.com/439038862', '_blank'), email: () => location.href = 'mailto:653294795@qq.com?subject=你好！&body=你好！', top: () => scrollTo({ top: 0, behavior: 'smooth' }) })[a]();
            menu.style.display = 'none';
        });
    }

    /* ── 樱花 ── */
    function initSakura() {
        const cvs = document.getElementById('sakuraCanvas');
        const ctx = cvs.getContext('2d');
        const resize = () => { cvs.width = innerWidth; cvs.height = innerHeight; };
        resize();
        window.addEventListener('resize', resize);

        const petals = Array.from({ length: 45 }, () => ({
            x: Math.random() * cvs.width,
            y: Math.random() * cvs.height,
            r: Math.random() * 6 + 3,
            vx: (Math.random() - 0.5) * 0.8,
            vy: Math.random() * 0.8 + 0.3,
            o: Math.random() * 0.6 + 0.2,
            rot: Math.random() * Math.PI * 2,
            rv: (Math.random() - 0.5) * 0.02
        }));

        (function loop() {
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            petals.forEach(p => {
                p.x += p.vx; p.y += p.vy; p.rot += p.rv;
                if (p.y > cvs.height + p.r) { p.y = -p.r; p.x = Math.random() * cvs.width; }
                if (p.x > cvs.width + p.r) p.x = -p.r;
                if (p.x < -p.r) p.x = cvs.width + p.r;

                ctx.save();
                ctx.globalAlpha = p.o;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.beginPath();
                ctx.ellipse(0, 0, p.r, p.r * 0.6, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#a8d8ea';
                ctx.fill();
                ctx.restore();
            });
            requestAnimationFrame(loop);
        })();
    }

    /* ── 弹窗 ── */
    function initModal() {
        const modal = document.getElementById('blogModal');
        setTimeout(() => modal.classList.add('show'), 2000);
        document.querySelector('.modal-close').addEventListener('click', () => modal.classList.remove('show'));
        document.getElementById('blogGoBtn').addEventListener('click', () => { location.href = 'doc/index.html'; });
        modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });
    }

    /* ── 滚动渐入 ── */
    function initScrollReveal() {
        document.querySelectorAll('.animate-in').forEach(el => {
            const delay = parseFloat(el.dataset.delay || 0) * 1000;
            setTimeout(() => el.classList.add('visible'), delay);
        });
    }
    </script>
</body>
</html>
