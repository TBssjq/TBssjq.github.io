<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水神崛起</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+KuaiLe&display=swap"></noscript>
    <style>
        :root {
            --font-display: 'ZCOOL KuaiLe', 'Noto Serif SC', serif;
            --font-body: 'Noto Serif SC', 'PingFang SC', sans-serif;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(162, 155, 254, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(129, 236, 236, 0.3) 0%, transparent 50%),
                linear-gradient(160deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
            color: #fff;
        }

        /* ── Header ── */
        header {
            width: 100%;
            text-align: center;
            padding: 36px 20px 28px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        header h1 {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 0 30px rgba(129, 236, 236, 0.3);
        }

        .clock {
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            /* 深色底上 0.5 的白字对比度只有 4:1 出头，抬到 0.68 */
            color: rgba(255, 255, 255, 0.68);
            letter-spacing: 0.15em;
            margin-top: 10px;
            font-variant-numeric: tabular-nums;
        }

        /* ── Main Card ── */
        .stage {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            width: 100%;
        }

        .card {
            position: relative;
            width: min(380px, 85vw);
            height: min(380px, 85vw);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .blob {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(100, 200, 255, 0.08);
            border-radius: 40% 60% 65% 35% / 45% 50% 55% 50%;
            /* 原来 morph 同时改 border-radius：圆角不是合成属性，每帧都得把三个
               380px 的模糊块重新栅格化。现在只转 transform —— 不对称圆角转起来
               本身就有"形状在变"的错觉，观感几乎一样，开销降到合成层级别。 */
            animation: blobSpin 26s linear infinite;
            box-shadow: 0 0 60px rgba(100, 200, 255, 0.08), inset 0 0 60px rgba(100, 200, 255, 0.04);
            will-change: transform;
        }

        .blob:nth-child(2) {
            animation-delay: -9s;
            animation-duration: 32s;
            animation-direction: reverse;
            background: rgba(162, 155, 254, 0.06);
            border-radius: 60% 40% 35% 65% / 50% 55% 45% 50%;
        }

        .blob:nth-child(3) {
            animation-delay: -17s;
            animation-duration: 38s;
            background: rgba(129, 236, 236, 0.05);
            border-radius: 35% 65% 50% 50% / 60% 40% 60% 40%;
        }

        @keyframes blobSpin {
            0%   { transform: rotate(0deg) scale(1); }
            50%  { transform: rotate(180deg) scale(1.04); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .card-content {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .card-content h2 {
            font-family: var(--font-body);
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 0.25em;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
        }

        .qq-badge {
            display: inline-block;
            padding: 14px 36px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            font-family: var(--font-display);
            font-size: 1.4rem;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.92);
            /* 号牌只是展示，不能点；用 text 光标 + 全选更方便直接复制 */
            cursor: text;
            user-select: all;
            transition: background-color 0.4s var(--ease-spring),
                        transform 0.4s var(--ease-spring),
                        box-shadow 0.4s var(--ease-spring);
        }

        .qq-badge:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 32px rgba(100, 200, 255, 0.15);
        }

        /* ── Particles ── */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .dot {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: rise 18s infinite;
        }

        @keyframes rise {
            0%, 100% { transform: translateY(100vh); opacity: 0; }
            8%       { opacity: 1; }
            92%      { opacity: 1; }
            100%     { transform: translateY(-10vh); opacity: 0; }
        }

        /* ── Footer ── */
        footer {
            padding: 20px;
            text-align: center;
            font-size: 0.8rem;
            /* 0.25 的白字在深底上等于看不见 */
            color: rgba(255, 255, 255, 0.48);
            letter-spacing: 0.1em;
        }

        /* 键盘焦点 */
        :focus-visible {
            outline: 2px solid rgba(129, 236, 236, 0.9);
            outline-offset: 3px;
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            .blob { animation-duration: 34s; }
            .dot:nth-child(n+17) { display: none; }   /* 小屏粒子减半 */
        }

        @media (prefers-reduced-motion: reduce) {
            .blob,
            .dot {
                animation: none;
            }
            .blob { will-change: auto; }
            .qq-badge { transition: none; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <header>
        <h1>水神崛起</h1>
        <div class="clock" id="clock"></div>
    </header>

    <div class="stage">
        <div class="card">
            <div class="blob"></div>
            <div class="blob"></div>
            <div class="blob"></div>
            <div class="card-content">
                <h2>联系QQ</h2>
                <div class="qq-badge">653294795</div>
            </div>
        </div>
    </div>

    <footer>水神崛起 &copy; 版权所有</footer>

    <script>
        /* ── Clock ── */
        const pad = n => String(n).padStart(2, '0');
        const clockEl = document.getElementById('clock');
        let lastClock = '';
        function tick() {
            const d = new Date();
            const text = `${d.getFullYear()}年${pad(d.getMonth() + 1)}月${pad(d.getDate())}日 `
                + `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
            // 只有文本真的变了才写 DOM
            if (text !== lastClock) { lastClock = text; clockEl.textContent = text; }
        }
        tick();
        let clockTimer = setInterval(tick, 1000);
        // 页面切到后台就停表，回来再补一次
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearInterval(clockTimer);
                clockTimer = null;
            } else if (!clockTimer) {
                tick();
                clockTimer = setInterval(tick, 1000);
            }
        });

        /* ── Particles ── */
        const box = document.getElementById('particles');
        const noMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const COUNT = window.matchMedia('(max-width: 768px)').matches ? 16 : 40;
        if (!noMotion) {
            for (let i = 0; i < COUNT; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.style.left = Math.random() * 100 + '%';
                dot.style.animationDelay = Math.random() * 18 + 's';
                dot.style.animationDuration = (12 + Math.random() * 10) + 's';
                const s = 2 + Math.random() * 3;
                dot.style.width = dot.style.height = s + 'px';
                box.appendChild(dot);
            }
        }
    </script>

    <div style="display:flex;justify-content:center;align-items:center;margin:32px auto 0;padding-bottom:env(safe-area-inset-bottom,0);">
        <iframe frameborder="no" border="0" marginwidth="0" marginheight="0" width="330" height="86"
                loading="lazy" title="网易云音乐播放器"
                src="//music.163.com/outchain/player?type=2&amp;id=65546&amp;auto=1&amp;height=66"
                style="border-radius:12px;max-width:100%;"></iframe>
    </div>
</body>
</html>
