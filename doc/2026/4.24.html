                <h1 class="article-title text-3xl lg:text-4xl text-center mb-8">无题</h1>

            <div class="article-body prose text-gray-700 dark:text-gray-300">
                    <p>放学路上，几个初三的学生在准备中考体育，一句句"还剩三天"很响，很清。我站在路边，停住了脚步。现在我站在墙的另一边了。</p>

                    <p>可现在我有点不确定了。我想，我们究其一生追求的是什么呢？不过是一个巨大的围墙罢了，脱离了现实，纯粹的抽象，才是理想的样子。倘若硬要融进去，也算是一件庆事。</p>

                    <p>我的围墙，是用半懂不懂的哲思砌成的。这种纯粹，本身就已经是一种理想了。</p>

                    <p>我没有什么沧桑可感慨，也没有什么浮态能笑看。我只是有点想念，那个会为了一句"还剩三天"而心跳加速的年纪。</p>

                    <p>但没关系，这种不懂，才是这个年纪最宝贵的东西。</p>

                    <div class="my-8">
                        <img src="4.24.png" alt="AI生成图片" class="w-full rounded-xl shadow-lg" loading="lazy">

                    </div>
