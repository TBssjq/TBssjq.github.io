<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章目录 - My Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Serif SC', 'PingFang SC', 'system-ui', 'sans-serif'],
                        display: ['ZCOOL KuaiLe', 'cursive'],
                    },
                    colors: {
                        accent: '#f97316',
                    }
                }
            }
        }
    </script>
    <style>
        /* ====== 设计 Token ====== */
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --accent: #f97316;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dark {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border-color: #334155;
        }

        /* ====== 基础样式 ====== */
        body {
            background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
        }

        /* ====== 导航栏 ====== */
        .site-header {
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .theme-toggle {
            transition: background-color 0.2s var(--ease);
        }

        /* ====== 页面标题 ====== */
        .page-title {
            font-family: 'ZCOOL KuaiLe', cursive;
            background: linear-gradient(135deg, #f97316, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ====== 文章列表动画 ====== */
        .article-list {
            animation: fadeUp 0.5s var(--ease) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ====== 文章卡片 ====== */
        .article-card {
            border: 1px solid transparent;
            transition: transform 0.3s var(--ease), border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
        }

        .article-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 10px 25px -5px rgba(249, 115, 22, 0.15);
        }

        .article-card__title {
            transition: color 0.2s var(--ease);
        }

        .article-card__title:hover {
            color: var(--accent);
        }

        /* ====== 年份标题 ====== */
        .year-heading {
            position: relative;
            padding-left: 20px;
        }

        .year-heading::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 1.2em;
            background: var(--accent);
            border-radius: 2px;
        }

        /* ====== 日期标签 ====== */
        .date-tag {
            background: rgba(249, 115, 22, 0.1);
            color: var(--accent);
            font-size: 0.75rem;
        }

        .dark .date-tag {
            background: rgba(249, 115, 22, 0.15);
        }

        /* ====== 响应式 ====== */
        @media (max-width: 768px) {
            .page-title { font-size: 1.875rem; }
        }

        /* ═══════════════════════════════════════════
           Claymorphism · 粘土态博客风格
           ═══════════════════════════════════════════ */

        body {
            background: #d8dde6;
        }

        .dark body {
            background: #121a2a !important;
        }

        /* ── 导航栏 — 陶土凸起 ── */
        .site-header {
            background: #e0e5ec !important;
            border-bottom: none !important;
            box-shadow:
                6px 6px 16px rgba(163, 177, 198, 0.45),
                -4px -4px 12px rgba(255, 255, 255, 0.7);
        }

        .dark .site-header {
            background: #1a2030 !important;
            box-shadow:
                6px 6px 16px rgba(0, 0, 0, 0.35),
                -4px -4px 12px rgba(50, 60, 80, 0.2);
        }

        /* 返回按钮 — 陶土凸起 */
        .site-header a[href*="index.html"] {
            background: #e0e5ec !important;
            color: #5a6a7a !important;
            border-radius: 14px !important;
            box-shadow:
                4px 4px 10px rgba(163, 177, 198, 0.5),
                -3px -3px 10px rgba(255, 255, 255, 0.65);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }

        .dark .site-header a[href*="index.html"] {
            background: #242e42 !important;
            color: #94a3b8 !important;
            box-shadow:
                4px 4px 10px rgba(0, 0, 0, 0.3),
                -3px -3px 10px rgba(50, 62, 85, 0.25);
        }

        .site-header a[href*="index.html"]:hover {
            transform: translateY(-2px);
            box-shadow:
                6px 6px 14px rgba(163, 177, 198, 0.45),
                -4px -4px 14px rgba(255, 255, 255, 0.55);
        }

        /* 主题切换 — 陶土圆形 */
        .theme-toggle {
            background: #e0e5ec !important;
            border-radius: 50% !important;
            box-shadow:
                4px 4px 10px rgba(163, 177, 198, 0.5),
                -3px -3px 10px rgba(255, 255, 255, 0.65);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }

        .dark .theme-toggle {
            background: #242e42 !important;
            box-shadow:
                4px 4px 10px rgba(0, 0, 0, 0.3),
                -3px -3px 10px rgba(50, 62, 85, 0.25);
        }

        .theme-toggle:hover {
            transform: scale(1.08);
            box-shadow:
                inset 3px 3px 8px rgba(163, 177, 198, 0.4),
                inset -3px -3px 8px rgba(255, 255, 255, 0.6);
        }

        /* ── 文章卡片 — 陶土凸起 ── */
        .article-card {
            background: #e0e5ec !important;
            border: none !important;
            box-shadow:
                8px 8px 20px rgba(163, 177, 198, 0.48),
                -8px -8px 20px rgba(255, 255, 255, 0.72),
                inset 0 0 0 rgba(163, 177, 198, 0);
            transition: all 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94) !important;
        }

        .dark .article-card {
            background: #1a2030 !important;
            box-shadow:
                8px 8px 20px rgba(0, 0, 0, 0.32),
                -8px -8px 20px rgba(40, 52, 76, 0.18);
        }

        .article-card:hover {
            transform: translateY(-4px);
            box-shadow:
                5px 5px 14px rgba(163, 177, 198, 0.52),
                -5px -5px 14px rgba(255, 255, 255, 0.78),
                inset 3px 3px 8px rgba(163, 177, 198, 0.1);
        }

        .dark .article-card:hover {
            box-shadow:
                5px 5px 14px rgba(0, 0, 0, 0.28),
                -5px -5px 14px rgba(40, 52, 76, 0.22);
        }

        /* ── 日期标签 — 陶土凹陷 ── */
        .date-tag {
            background: #e0e5ec !important;
            color: var(--accent) !important;
            border-radius: 9999px !important;
            font-size: 0.73rem !important;
            box-shadow:
                inset 3px 3px 8px rgba(163, 177, 198, 0.45),
                inset -3px -3px 8px rgba(255, 255, 255, 0.65);
        }

        .dark .date-tag {
            background: #242e42 !important;
            box-shadow:
                inset 3px 3px 8px rgba(0, 0, 0, 0.3),
                inset -3px -3px 8px rgba(50, 62, 85, 0.25);
        }

        /* ── 年份标题装饰线 ── */
        .year-heading::before {
            width: 5px !important;
            border-radius: 3px !important;
            box-shadow: 0 0 8px rgba(249, 115, 22, 0.4);
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- 导航栏 -->
    <header class="site-header fixed top-0 left-0 right-0 h-16 bg-white/80 dark:bg-gray-900/80 z-40">
        <div class="h-full flex items-center justify-between px-6">
            <a href="#" class="text-xl font-bold text-gray-900 dark:text-white">My Blog</a>
            <div class="flex items-center gap-4">
                <a href="../index.html" class="inline-flex items-center gap-2 px-4 py-2 text-sm text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-800 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-9V3a1 1 0 00-1-1h-3a1 1 0 00-1 1v9"/>
                    </svg>
                    <span>返回主页</span>
                </a>
                <button id="themeToggle" class="theme-toggle p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800">
                <svg id="sunIcon" class="w-5 h-5 text-gray-600 dark:text-gray-400 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
                <svg id="moonIcon" class="w-5 h-5 text-gray-600 dark:text-gray-400 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="pt-16">
        <div class="max-w-2xl mx-auto px-4 py-12 lg:py-16">
            <!-- 页面标题 -->
            <div class="text-center mb-12">
                <h1 class="page-title text-3xl lg:text-4xl mb-4">文章目录</h1>
                <p class="text-gray-500 dark:text-gray-400">在隆冬，我终于知道，我身上有一个不可战胜的夏天</p>
            </div>

            <!-- 文章列表 -->
            <div class="article-list space-y-12">
                <!-- 2026 年 -->
                <section>
                    <h2 class="year-heading text-lg font-semibold text-gray-800 dark:text-gray-200 mb-6">2026</h2>
                    <div class="space-y-4">
                        <article class="article-card p-5 bg-white dark:bg-gray-800 rounded-xl">
                            <a href="2026/7.21.html" class="block">

                            <div class="flex items-start justify-between gap-4">
                                <div>
                                    
                                        <h3 class="article-card__title text-lg font-semibold text-gray-900 dark:text-white mb-2">最佳损友2026年7月21日</h3>
                                    
                                    <p class="text-sm text-gray-500 dark:text-gray-400 line-clamp-2">这个吧(指百度贴吧 最佳损友吧)是我在高中时微机课上刷到的，当时也比较感慨，现在也是。</p>
                                </div>
                                <span class="date-tag px-3 py-1 rounded-full font-medium shrink-0">7月21日</span>
                            </div>
                            </a>
                        </article>

                        <article class="article-card p-5 bg-white dark:bg-gray-800 rounded-xl">
                            <a href="2026/5.30.html" class="block">

                            <div class="flex items-start justify-between gap-4">
                                <div>
                                    
                                        <h3 class="article-card__title text-lg font-semibold text-gray-900 dark:text-white mb-2">心定不着微物起</h3>
                                    
                                    <p class="text-sm text-gray-500 dark:text-gray-400 line-clamp-2">不到芒种，不知心焦。数着所剩无几的日子，笑着说"要解放了"，心里空落落的...</p>
                                </div>
                                <span class="date-tag px-3 py-1 rounded-full font-medium shrink-0">5月30日</span>
                            </div>
                            </a>
                        </article>

                        <article class="article-card p-5 bg-white dark:bg-gray-800 rounded-xl">
                            <a href="2026/4.24.html" class="block">

                            <div class="flex items-start justify-between gap-4">
                                <div>
                                    
                                        <h3 class="article-card__title text-lg font-semibold text-gray-900 dark:text-white mb-2">无题</h3>
                                    
                                    <p class="text-sm text-gray-500 dark:text-gray-400 line-clamp-2">放学路上，几个初三的学生在准备中考体育，一句句"还剩三天"很响，很清...</p>
                                </div>
                                <span class="date-tag px-3 py-1 rounded-full font-medium shrink-0">4月24日</span>
                            </div>
                            </a>
                        </article>
                    </div>
                </section>

                <!-- 2025 年 -->
                <section>
                    <h2 class="year-heading text-lg font-semibold text-gray-800 dark:text-gray-200 mb-6">2025</h2>
                    <div class="space-y-4">
                        <article class="article-card p-5 bg-white/50 dark:bg-gray-800/50 rounded-xl opacity-60">
                            <div class="flex items-start justify-between gap-4">
                                <div>
                                    <h3 class="text-lg font-semibold text-gray-500 dark:text-gray-400 mb-2">即将发布</h3>
                                    <p class="text-sm text-gray-400 dark:text-gray-500">更多文章即将到来...</p>
                                </div>
                                <span class="date-tag px-3 py-1 rounded-full font-medium shrink-0">敬请期待</span>
                            </div>
                        </article>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script>
        /* ====== 暗色模式切换 ====== */
        const themeToggle = document.getElementById('themeToggle');
        const root = document.documentElement;

        // 初始化主题
        if (localStorage.getItem('theme') === 'dark' ||
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            root.classList.add('dark');
        }

        themeToggle.addEventListener('click', () => {
            root.classList.toggle('dark');
            localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
        });
    </script>
</body>
</html>
